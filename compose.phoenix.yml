# Standalone observability service: never builds or recreates the API image.
services:
  phoenix:
    image: arizephoenix/phoenix:20.11.0
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped
volumes:
  phoenix_data:
