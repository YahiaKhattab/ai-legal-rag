[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-legal-rag"
version = "0.1.0"
description = "Local citation-grounded RAG system for Arabic and English legal documents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "qdrant-client==1.19.0",
    "sentence-transformers==5.1.1",
    "tokenizers==0.22.2",

    # API
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-multipart==0.0.32",
]


[project.scripts]
legal-rag-health = "legal_rag.health:main"
legal-rag-ingest = "legal_rag.ingestion.cli:main"
legal-rag-query = "legal_rag.query.cli:main"


[project.optional-dependencies]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.1.1",
]

dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires local services and external model artifacts",
]


[tool.coverage.run]
branch = true
source = ["legal_rag"]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/legal_rag/query/answer_validator.py" = ["RUF001"]
"src/legal_rag/query/evidence_sufficiency.py" = ["RUF001"]
"src/legal_rag/query/pipeline.py" = ["RUF001"]
"tests/test_query_answer_language.py" = ["RUF001"]


[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
